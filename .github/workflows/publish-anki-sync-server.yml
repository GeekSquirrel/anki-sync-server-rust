name: Publish Anki sync server image

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve latest Anki release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name=$(gh api repos/ankitects/anki/releases/latest --jq .tag_name)
          version=${tag_name#v}
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve image repository
        id: image_repo
        run: |
          image_repo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "value=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Restore last known Anki version
        id: version_cache
        uses: actions/cache@v4.2.0
        with:
          path: .cache/anki-version.txt
          key: anki-version-cache

      - name: Resolve upstream Rust version
        id: rust
        run: |
          rust_version=$(curl -fsSL "https://raw.githubusercontent.com/ankitects/anki/${ANKI_TAG}/rust-toolchain.toml" | sed -n 's/^channel = "\([^"]*\)"$/\1/p')
          if [ -z "$rust_version" ]; then
            echo "could not determine Rust channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"
        env:
          ANKI_TAG: ${{ steps.release.outputs.tag_name }}

      - name: Check whether Anki version changed
        id: version_change
        run: |
          version="${{ steps.release.outputs.version }}"
          if [ -f .cache/anki-version.txt ]; then
            last_version=$(cat .cache/anki-version.txt)
          else
            last_version=""
          fi

          echo "last_version=$last_version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$last_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Anki version unchanged: $version"
          else
            mkdir -p .cache
            printf '%s\n' "$version" > .cache/anki-version.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Anki version changed: $version"
          fi

      - name: Log in to GHCR
        if: steps.version_change.outputs.changed == 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether the image already exists
        if: steps.version_change.outputs.changed == 'true'
        id: check
        run: |
          image="ghcr.io/${{ steps.image_repo.outputs.value }}:${{ steps.release.outputs.version }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build because no new upstream version or image already exists
        if: steps.version_change.outputs.changed != 'true' || steps.check.outputs.exists == 'true'
        run: echo "Skipping image build because no new upstream Anki release was detected or the target image already exists."

      - name: Set up Docker Buildx
        if: steps.version_change.outputs.changed == 'true' && steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.version_change.outputs.changed == 'true' && steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            RUST_VERSION=${{ steps.rust.outputs.version }}
            ANKI_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/${{ steps.image_repo.outputs.value }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.image_repo.outputs.value }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max